zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 84f59250a5ce491e9bcdc0bf87c45e60
      name: Templates/Linux monitoring
  templates:
    - uuid: d851adeaf3f24dabb6c8ca9e46e59a40
      template: 'Linux SMART by Collector'
      name: 'Linux SMART by Collector'
      groups:
        - name: Templates/Linux monitoring
      items:
        - uuid: 32933f6f1cbb40c589cea10e21012457
          name: 'SMART: Collector JSON'
          type: ZABBIX_ACTIVE
          key: smart.cache.json
          history: '1d'
          trends: '0'
          value_type: TEXT
          update_interval: 5m
          tags:
            - tag: component
              value: storage
        - uuid: b6688bfe9f76489d8d474479aa350936
          name: 'SMART: Collector status'
          type: DEPENDENT
          key: smart.collector.status
          value_type: CHAR
          master_item:
            key: smart.cache.json
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.status'
          tags:
            - tag: component
              value: storage
        - uuid: c23d28386f204502b1f82b5a200b7192
          name: 'SMART: Failed device collections'
          type: DEPENDENT
          key: smart.collector.failed_count
          value_type: UNSIGNED
          master_item:
            key: smart.cache.json
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.discovery.failed_count'
          tags:
            - tag: component
              value: storage
      discovery_rules:
        - uuid: 753371ea9652475cb1ac854aa662e5c6
          name: 'SMART disk discovery'
          type: DEPENDENT
          key: smart.disk.discovery
          lifetime: '0'
          master_item:
            key: smart.cache.json
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.disks'
          lld_macro_paths:
            - lld_macro: '{#DEVICE}'
              path: '$.device'
            - lld_macro: '{#MODEL}'
              path: '$.model'
          item_prototypes:
            - uuid: 14ea569672f44385b4712e6fdb912f0d
              name: 'SMART {#DEVICE}: health'
              type: DEPENDENT
              key: 'smart.health[{#DEVICE}]'
              value_type: UNSIGNED
              master_item:
                key: smart.cache.json
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.disks[?(@.device=="{#DEVICE}")].smart_passed.first()'
                  error_handler: DISCARD_VALUE
                - type: BOOL_TO_DECIMAL
            - uuid: 5eaa56a7535d4ae9b3386e5a327ec188
              name: 'SMART {#DEVICE}: temperature'
              type: DEPENDENT
              key: 'smart.temperature[{#DEVICE}]'
              value_type: FLOAT
              units: °C
              master_item:
                key: smart.cache.json
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.disks[?(@.device=="{#DEVICE}")].temperature_c.first()'
                  error_handler: DISCARD_VALUE
