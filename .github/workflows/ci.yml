name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck shfmt python3-yaml

      - name: Run project tests
        run: make test

      - name: Run ShellCheck
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning

      - name: Check formatting
        run: |
          find . -type f -name '*.sh' -print0 \
            | xargs -0 shfmt -d -i 4 -ci

      - name: Validate Zabbix YAML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path('zabbix/templates').glob('*.yaml'):
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
              print(f'[PASS] {path}')
          PY
